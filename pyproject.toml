[project]
name = "ai-book-reader"
version = "0.1.0"
description = "Private, camera-based storybook reader"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mangum>=0.19,<1",
  "pillow>=12,<13",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "boto3-stubs[dynamodb,s3,sqs,secretsmanager,cloudformation,cognito-idp,sts]>=1.40,<2",
  "moto[s3,dynamodb,sqs,secretsmanager]>=5,<6",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "scripts/export_contracts.py", "scripts/smoke_providers.py", "scripts/evaluate_vision.py", "scripts/deploy_cloud.py", "scripts/smoke_cloud.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
